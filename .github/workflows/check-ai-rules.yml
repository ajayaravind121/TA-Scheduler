# Fails if any CS 361 AI rule file was changed or deleted.
# If the instructor updates a rule file, recompute its hash with:  sha256sum <file>
name: Check AI rule files

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify AI rule files are unchanged
        run: |
          cat > expected.sha256 <<'EOF'
          227f900cd69c65eadc514fb23cdd5b4dfeee2a8af9cfd7c33c4ab19b0a30598c  write.md
          02f8e79b0c1becb1c77b1ad8fee20e9a944b2ccf80784e0212e8dbc6d2ff6ee8  .github/copilot-instructions.md
          f65ece2a564ebb4aefc3c17861fc0949b8d7a3fee0d9dd046e04b206a71f372e  .github/instructions/student-logic.instructions.md
          EOF
          sed -i 's/^ *//' expected.sha256
          if sha256sum -c expected.sha256; then
            echo "All AI rule files are unchanged."
          else
            echo "::error::An AI rule file (write.md or a file that points to it) was changed or deleted. Restore it from the starter repo."
            exit 1
          fi
